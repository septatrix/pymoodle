[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pymoodle"
version = "0.3.2"
description = "A python client for Moodle web services"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nils Kattenbeck", email = "nilskemail+pypi@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1"]

[project.urls]
Homepage = "https://github.com/septatrix/pymoodle"
"Bug Tracker" = "https://github.com/septatrix/pymoodle/issues"

[dependency-groups]
dev = ["mypy", "pyright", "ruff"]

[tool.setuptools.packages.find]
include = ["moodle*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "I",   # isort
    "PIE", # flake8-pie
    "RUF", # ruff-specific rules
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "E501", # line length is handled by the formatter, long strings are fine
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["moodle", "tests"]

[tool.pyright]
include = ["moodle", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
